name: Build mm-tg

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The native (C/C++) part of the app rarely changes and takes a long time to build.
  # It is built once per change of TMessagesProj/jni (incl. submodule pins) and cached.
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute native cache key
        id: key
        run: |
          echo "key=native-arm64-v3-$(git ls-tree HEAD TMessagesProj/jni TMessagesProj/build.gradle | sha1sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore native libs
        id: cache
        uses: actions/cache@v4
        with:
          path: prebuilt-native
          key: ${{ steps.key.outputs.key }}

      - name: Free disk space
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Checkout native submodules
        if: steps.cache.outputs.cache-hit != 'true'
        run: git submodule update --init --recursive --depth 1 --jobs 8

      - uses: actions/setup-java@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          distribution: temurin
          java-version: 17

      - name: Install NDK and CMake
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "cmake;3.22.1" "build-tools;36.0.0" "platforms;android-36" > /dev/null

      - name: Build native libraries
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          ./gradlew --no-daemon :TMessagesProj:externalNativeBuildRelease
          mkdir -p prebuilt-native/arm64-v8a
          find TMessagesProj/build/intermediates -path '*arm64-v8a*' -name '*.so' -print -exec cp {} prebuilt-native/arm64-v8a/ \;
          STRIP="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          for f in prebuilt-native/arm64-v8a/*.so; do "$STRIP" --strip-unneeded "$f"; done
          ls -la prebuilt-native/*
          test -f prebuilt-native/arm64-v8a/libtmessages.49.so

      - uses: actions/upload-artifact@v4
        with:
          name: native-libs
          path: prebuilt-native
          retention-days: 30

  app:
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Java submodules
        run: git submodule update --init --depth 1 TMessagesProj_Modules/media TMessagesProj/lib/jlatexmath

      - uses: actions/download-artifact@v4
        with:
          name: native-libs
          path: prebuilt-native

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0" "platforms;android-36" > /dev/null

      - name: Set up signing key
        env:
          KEYSTORE_B64: ${{ secrets.MMTG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/mmtg.keystore"
            echo "MMTG_KEYSTORE=$RUNNER_TEMP/mmtg.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          MMTG_KEYSTORE_PASSWORD: ${{ secrets.MMTG_KEYSTORE_PASSWORD }}
          MMTG_KEY_ALIAS: ${{ secrets.MMTG_KEY_ALIAS }}
        run: |
          ./gradlew --no-daemon :TMessagesProj_App:assembleAfatDebug -PprebuiltNative="$GITHUB_WORKSPACE/prebuilt-native"
          mkdir -p out
          cp TMessagesProj_App/build/outputs/apk/afat/debug/app.apk out/mm-tg.apk
          unzip -l out/mm-tg.apk | grep '\.so$' | head

      - uses: actions/upload-artifact@v4
        with:
          name: mm-tg-apk
          path: out/mm-tg.apk
          retention-days: 30

      - name: Publish rolling "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/mm-tg.apk --title "mm-tg latest (build ${{ github.run_number }})" --notes "Automated build of ${{ github.sha }}" --prerelease
